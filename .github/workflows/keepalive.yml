# Keeps the free-tier demo awake. Supabase pauses a free project after 7 days without
# database activity, so /health does a real SELECT 1. Render free services sleep after
# 15 minutes idle; this does not prevent that (the web app shows a "waking up" state).
# Set the repository variable API_URL, e.g. https://fieldcard-api.onrender.com
name: keepalive
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health (retries while the service wakes up)
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 20 --retry-all-errors \
            --max-time 90 "${{ vars.API_URL }}/health"
